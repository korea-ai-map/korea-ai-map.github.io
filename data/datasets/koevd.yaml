name: KoEVD
organization_id: keti
category: safety
description_ko: >-
  한국어 안전성 평가 데이터셋. 유해·민감 발화 13,552개와 응답 후보 71,395개를 바탕으로
  발화 위험·응답 선택·유해성·전략·도구 행동의 5단계 평가를 제공한다.
  별도 KoEVD-Compact는 기존 모델 응답으로 선정한 주 과업 400건과 선택적 도구 진단 200건이며,
  원본 공식 평가 분할을 대체하지 않고 과업 간 원발화도 겹칠 수 있다.
