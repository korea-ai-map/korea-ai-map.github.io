abstract_ko: >-
  일시정지 토큰을 추론 단계 경계에 두고 손실을 마스킹하는 MBP를 제안한다. 기존 분포의 덮어쓰기를
  줄이고 경계 인접 토큰에 다음 단계 정보를 압축해 1B~8B Qwen·Llama 모델에서 수학·코드 추론을
  개선하면서 일반 언어 이해 능력을 보존했다고 보고한다.
