abstract_ko: >-
  한국어 기반모델 평가를 위한 여섯 태스크·9,396문항의 KBS를 제안한다.
  번역 검수와 문화적 현지화, 한국어 문학 원문, 한국어용 지시 검증 규칙을 결합하고,
  모델 접근 방식·프롬프트·채점 설정이 결과 해석에 미치는 영향을 분석한다.
