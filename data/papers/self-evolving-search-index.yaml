abstract_ko: >-
  검색 실패를 진단하고 관련 색인 키를 수정·검증하는 Self-Index를 제안한다.
  질의 시뮬레이터로 새로운 검색 요구를 탐색하면서 색인을 반복 개선하며,
  다양한 문서 검색과 검색 에이전트·장기 메모리 검색 과제에서 효과를 평가한다.
