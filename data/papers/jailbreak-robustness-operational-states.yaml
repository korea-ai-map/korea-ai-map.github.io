title: The Fragility of Jailbreak Robustness Across Operational States
authors_org: Yonsei University · KIST · Korea University · Kyung Hee University
venue: Findings of EMNLP 2026
year: 2026
arxiv_id: '2608.30748'
url: https://arxiv.org/abs/2608.30748
abstract_ko: >-
  공격은 그대로 둔 채 일반적인 시스템 프롬프트로 운용 상태만 바꿔도 7개 정렬 모델의 탈옥 성공률이
  크게 달라짐을 보인다. 한 사례에서는 성공률이 2%에서 58%로 상승했으며, 이 변동이 거부 관련
  은닉표현 축과 연관됨을 분석해 단일 기본 상태 평가의 한계를 제시한다.
