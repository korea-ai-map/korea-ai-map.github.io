name_en: G-Fit Studio
organization_id: sk-ax
description_ko: >-
  SK AX가 2026년 10월 29일 출시한 기업 채용·구성원 육성용 AI 역량진단 솔루션.
  AI 에이전트와 업무 문제를 해결하는 과정과 가상 면접관의 후속 문답을 분석해 문제해결력·의사소통·AI 활용 역량을 진단한다.
  직무별 과제 설계와 영어·일본어 등을 지원하며, SKALA 4기 선발에 실제 적용됐다.
  진단 결과로 인사담당자의 판단을 지원하며, 기반 모델과 모델 개발 주체는 공개되지 않았다.
