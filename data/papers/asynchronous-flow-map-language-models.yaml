title: Asynchronous Flow Map Language Models
authors_org: KAIST · Purdue University · The University of Tokyo
venue: arXiv
year: 2026
arxiv_id: '2610.42018'
url: https://arxiv.org/abs/2610.42018
abstract_ko: >-
  토큰마다 다른 디노이징 일정을 사용하는 비동기 흐름을 한 단계 언어 모델에 증류한다.
  고정된 일정과 상태에 따라 학습한 일정을 모두 다루며, 토큰 생성 순서의 정보를
  내부 계산에 반영하면서 전체 토큰을 한 번에 예측한다. 스도쿠와 수학 문제의 코드
  생성에서 평가하며, 검증 시점에 코드와 체크포인트는 공개 예정 상태다.
