description_ko: >-
  정답 참조 없이 검색의 질의 커버리지와 생성 답변 주장의 검증 가능성을 평가하는 RAG 벤치마크.
  검색기에는 C-Prec@k·C-nDCG@k, 생성기에는 완전성·간결성·검증 가능성 지표를 제공한다.
