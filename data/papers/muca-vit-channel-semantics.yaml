abstract_ko: >-
  다중 채널 이미지의 공통 구조와 채널별 정보를 분리해 학습하는 MuCa-ViT를 제안한다.
  문맥 토큰의 상관을 줄여 일부 채널에 표현이 쏠리는 현상을 완화하고, 입력의 채널
  구성에 맞춰 특징을 조절한다. 세포 영상 및 원격 탐사 데이터인 JUMP-CP·CHAMMI·
  So2Sat에서 서로 다른 채널 구성에 대한 일반화를 평가한다.
