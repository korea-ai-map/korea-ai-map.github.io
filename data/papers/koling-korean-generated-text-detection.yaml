abstract_ko: >-
  한국어 문장의 길이·문장부호 같은 표면적 단서에 의존하는 생성 텍스트 탐지를 분석하고,
  사람이 쓴 글·LLM이 수정한 글·LLM이 생성한 글을 구분하는 50,902개 평가 사례의 KoLing을 제안한다.
  음운·형태·통사·의미·화용의 47개 특징을 결합한 KoLingProbe로 탐지 성능과 오탈자 강건성을 평가한다.
