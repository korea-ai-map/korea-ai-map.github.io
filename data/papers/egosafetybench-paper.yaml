title: 'EgoSafetyBench: A Diagnostic Egocentric Video Benchmark for Evaluating Embodied VLMs as Runtime Safety Guards'
authors_org: AIM Intelligence · Seoul National University
venue: arXiv
year: 2026
arxiv_id: '2607.00218'
url: https://arxiv.org/abs/2607.00218
abstract_ko: >-
  체화형 VLM의 실시간 안전 감시 능력을 진단하는 1,200개 1인칭 영상 벤치마크를 제안한다. 일상·의심스러운 안전 장면과 명백·맥락 의존 위험을 구분하고, 장면 속 거짓 표지가 물리적 안전 판단을 흐리는지를 별도 축으로 평가해 위험 순간 누락과 과잉 개입 문제를 분석한다.
