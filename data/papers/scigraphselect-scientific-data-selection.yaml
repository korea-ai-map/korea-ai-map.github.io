title: 'SciGraphSelect: Auditable Scientific Data Selection through Knowledge–Reasoning Graphs'
authors_org: KT Corporation
venue: NeurIPS 2026 AI4Science Workshop
year: 2026
arxiv_id: '2610.41280'
