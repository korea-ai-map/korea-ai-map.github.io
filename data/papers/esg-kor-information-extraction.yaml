abstract_ko: >-
  한국 기업의 지속가능경영보고서에서 ESG 정보를 추출하기 위한 한국어 문장 데이터와 분류 실험을 제시한다.
  평가기관의 기준에 따른 수작업 레이블을 사용하고 중소기업 문서 분석으로 적용 범위를 살핀다.
  2024년 발표 논문으로, arXiv에는 2026년 10월 등록됐다.
