title: 'Multi-Step Tool-Calling over Korean Open Public APIs: A Benchmark and a Data-Synthesis Recipe'
authors_org: LG CNS
venue: EMNLP 2026 Industry Track
year: 2026
arxiv_id: '2609.05395'
url: https://arxiv.org/abs/2609.05395
abstract_ko: >-
  한국 공공 API를 여러 단계로 호출하는 실제 과제 145개로 KOPA-Bench를 만들고, 실제 호출에 성공한
  도구 입출력 연결만 그래프로 유지해 실행 가능한 궤적을 합성하는 EDGE를 제안한다. 합성 데이터로
  GRPO 학습한 9B 모델이 같은 계열의 미학습 27B 모델에 근접하는 결과를 보고한다.
